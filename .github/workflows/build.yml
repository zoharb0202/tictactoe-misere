name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build TicTacToeMisere.sln -c Release
      - name: Test
        run: dotnet test tests/TicTacToeMisere.Tests -c Release --no-build
      - name: Upload game build
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToeMisere-win
          path: src/TicTacToeMisere.WinFormsUI/bin/Release/net48/
